# GitHub Actions : quality gates obligatoires avant fusion dans main (constitution, research.md R16).
# À rendre obligatoire dans Settings › Branches › règle de protection de main (« ci / verify »).
# Le job nvd tient la base de Dependency-Check à jour dans le cache, à partir des flux JSON 2.0
# publiés par NIST (un fichier par année, puis le flux « modified ») : pas d'API NVD, pas de clé.
# Le job verify utilise cette base sans rien télécharger.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # rafraîchit chaque nuit la base NVD sur main, que toutes les branches peuvent restaurer
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NVD_DATA: /home/runner/.cache/dependency-check-data

jobs:
  # Base NVD de Dependency-Check, mise en cache : le premier remplissage lit tous les flux annuels,
  # les suivants seulement le flux des modifications récentes.
  nvd:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # un nouveau push n'interrompt pas un remplissage en cours
    concurrency:
      group: nvd-${{ github.ref }}
      cancel-in-progress: false
    env:
      MAVEN_ARGS: >-
        -DdataDirectory=/home/runner/.cache/dependency-check-data -DnvdValidForHours=12
        -DnvdDatafeedUrl=https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Base NVD (restauration)
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NVD_DATA }}
          key: nvd-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nvd-

      # flux NIST indisponibles : avec une base déjà en cache, on continue avec elle (avertissement)
      - name: Base NVD (mise à jour)
        id: update
        continue-on-error: ${{ steps.restore.outputs.cache-matched-key != '' }}
        run: ./mvnw -B -pl backend dependency-check:update-only

      # seulement une base complète : une base interrompue remplacerait la précédente
      - name: Base NVD (sauvegarde)
        if: steps.update.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NVD_DATA }}
          key: nvd-${{ github.run_id }}-${{ github.run_attempt }}

  verify:
    needs: nvd
    # jamais « sauté » quand nvd échoue : un check requis sauté compterait comme réussi ;
    # sans base en cache, la restauration échoue et verify avec elle
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    env:
      # lu par ./mvnw (Maven 3.9) : base NVD préparée par le job nvd, sans appel à l'API
      MAVEN_ARGS: -DdataDirectory=/home/runner/.cache/dependency-check-data -DautoUpdate=false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks examine tout l'historique
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Base NVD (restauration)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NVD_DATA }}
          key: nvd-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nvd-
          fail-on-cache-miss: true

      - name: Outils (Semgrep, gitleaks)
        run: |
          pipx install semgrep
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Quality gates
        run: ci/verify.sh

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapports
          if-no-files-found: ignore
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            e2e/playwright-report/
            e2e/test-results/.e2e-state/*.log
