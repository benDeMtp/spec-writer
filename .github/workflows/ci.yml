# GitHub Actions : quality gates obligatoires avant fusion dans main (constitution, research.md R16).
# À rendre obligatoire dans Settings › Branches › règle de protection de main (« ci / verify »).
# Secret à déclarer : NVD_API_KEY (OWASP Dependency-Check ; sans clé, la base NVD se télécharge
# très lentement). La base NVD est mise en cache : chaque exécution restaure la plus récente et
# sauvegarde la sienne. Une base de moins de 24 h n'est pas remise à jour (nvdValidForHours) : une
# panne de l'API NVD ne bloque donc pas la CI si une exécution a abouti dans la journée.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # le premier remplissage du cache NVD (base complète) dépasse à lui seul 30 minutes
    timeout-minutes: 90
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      NVD_DATA: /home/runner/.cache/dependency-check-data
      # lu par ./mvnw (Maven 3.9) : base NVD hors du dépôt local Maven, qui a son propre cache
      MAVEN_ARGS: -DdataDirectory=/home/runner/.cache/dependency-check-data -DnvdValidForHours=24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks examine tout l'historique
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Base NVD (restauration)
        id: nvd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NVD_DATA }}
          key: nvd-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nvd-

      - name: Outils (Semgrep, gitleaks)
        run: |
          pipx install semgrep
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Quality gates
        run: ci/verify.sh

      # même si une gate échoue ou si le job est annulé après Dependency-Check, la base mise à jour
      # sert aux exécutions suivantes ; une base incomplète est simplement complétée la fois d'après
      - name: Base NVD (sauvegarde)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NVD_DATA }}
          key: nvd-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rapports
          if-no-files-found: ignore
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            e2e/playwright-report/
            e2e/test-results/.e2e-state/*.log
