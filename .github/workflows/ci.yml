# GitHub Actions : quality gates obligatoires avant fusion dans main (constitution, research.md R16).
# À rendre obligatoire dans Settings › Branches › règle de protection de main (« ci / verify »).
# Secret à déclarer : NVD_API_KEY (OWASP Dependency-Check ; sans clé, la base NVD se télécharge
# très lentement).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks examine tout l'historique
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Outils (Semgrep, gitleaks)
        run: |
          pipx install semgrep
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Quality gates
        run: ci/verify.sh

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          if-no-files-found: ignore
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            e2e/playwright-report/
            e2e/test-results/.e2e-state/*.log
