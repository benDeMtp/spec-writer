# Installeurs (T141, research.md R15) : un job par OS, chacun produit l'installeur de sa
# plateforme (jpackage ne fait pas de compilation croisée), publié dans la release du tag.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
          - target: macos-x64
            os: macos-15-intel
          - target: windows-x64
            os: windows-2022
          - target: linux-x64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Version de l'installeur (tag sans le « v »)
        shell: bash
        run: echo "SPECWRITER_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Les quality gates ont déjà tourné sur la PR (ci.yml) : ici, seulement l'installeur
      - name: Installeur
        shell: bash
        run: ./mvnw -B -Pdist package -DskipTests -DskipDependencyCheck

      - name: Publication dans la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(backend/target/jreleaser/assemble/spec-writer/jpackage/*.{dmg,msi,deb})
          if [ ${#files[@]} -eq 0 ]; then echo "Aucun installeur produit" >&2; exit 1; fi
          # le premier job crée la release, les suivants y ajoutent leur installeur
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
