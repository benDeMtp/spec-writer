# Installeurs (T141, research.md R15) : un job par OS, chacun produit l'installeur de sa
# plateforme (jpackage ne fait pas de compilation croisée), publié dans la release du tag.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # Maven Central limite le débit (429) : plus de reprises, plus espacées (3 et 5 s par défaut)
  MAVEN_OPTS: -Daether.connector.http.retryHandler.count=8 -Daether.connector.http.retryHandler.interval=10000

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
          - target: macos-x64
            os: macos-15-intel
          - target: windows-x64
            os: windows-2022
          - target: linux-x64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      # Dépôt Maven local : sans correspondance exacte (un pom a changé), le cache précédent est
      # repris et seuls les nouveaux artefacts viennent de Maven Central (limité en débit, 429).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          # repli : dernier cache, puis l'ancien de setup-java (cache: maven) à la première exécution
          restore-keys: |
            maven-${{ runner.os }}-
            setup-java-${{ runner.os }}-

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Version de l'installeur (tag sans le « v »)
        shell: bash
        run: echo "SPECWRITER_APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Les quality gates ont déjà tourné sur la PR (ci.yml) : ici, seulement l'installeur
      - name: Installeur
        shell: bash
        run: ./mvnw -B -Pdist package -DskipTests -DskipDependencyCheck

      - name: Publication dans la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(backend/target/jreleaser/assemble/spec-writer/jpackage/*.{dmg,msi,deb})
          if [ ${#files[@]} -eq 0 ]; then echo "Aucun installeur produit" >&2; exit 1; fi
          # le premier job crée la release, les suivants y ajoutent leur installeur
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
