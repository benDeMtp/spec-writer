# Installeurs de spec-writer (research.md R15, T140) : runtime jlink Java 25 puis jpackage.
# Lancé par ./mvnw -Pdist package, sur chaque OS cible (jpackage ne produit que pour l'OS courant).
# Ne pas lancer JReleaser directement sur ce fichier : le profil dist en écrit d'abord la version.
# Le jar est un uber-jar : JReleaser copie les jars à plat, ce que la disposition fast-jar de
# Quarkus (lib/, quarkus/) ne supporte pas.
project:
  name: spec-writer
  description: Rédaction assistée de spécifications, en local
  longDescription: >-
    spec-writer pose les questions qui manquent à un besoin, puis rédige les use cases et leurs
    scénarios d'acceptation. Il s'exécute sur le poste de l'utilisateur, avec GitHub Copilot et Jira.
  authors:
    - Benjamin Raimondi
  license: Apache-2.0
  vendor: spec-writer
  inceptionYear: '2026'
  languages:
    java:
      groupId: fr.kawamind
      artifactId: spec-writer-backend
      version: '25'
      # classe principale de l'uber-jar (Main-Class du manifeste) : le @QuarkusMain de la 019
      # remplace io.quarkus.runner.GeneratedMain, que Quarkus ne génère plus
      mainClass: fr.kawamind.infrastructure.platform.SpecWriterMain

assemble:
  jlink:
    spec-writer-runtime:
      active: ALWAYS
      exported: false
      imageName: 'spec-writer-runtime-{{ projectVersion }}'
      copyJars: false
      jdeps:
        enabled: false
      # Relevés au spike T011 (research.md R15) : jdeps, plus les modules chargés dynamiquement.
      # À revoir à chaque dépendance ajoutée :
      #   jdeps --multi-release 25 --ignore-missing-deps --print-module-deps backend/target/spec-writer-runner.jar
      moduleNames:
        - java.base
        - java.compiler
        - java.datatransfer
        - java.desktop
        - java.logging
        - java.management
        - java.naming
        - java.net.http
        - java.rmi
        - java.scripting
        - java.security.jgss
        - java.sql
        - java.transaction.xa
        - java.xml
        - jdk.charsets
        - jdk.jfr
        - jdk.localedata
        - jdk.management
        - jdk.net
        - jdk.security.auth
        - jdk.unsupported
        - jdk.zipfs
      args:
        - '--include-locales=en,fr'
        - '--compress=zip-6'
        - '--strip-debug'
        - '--no-header-files'
        - '--no-man-pages'
      # Le JDK de la machine de build ; seule la plateforme courante est assemblée
      targetJdks:
        - path: '{{ Env.JAVA_HOME }}'
          platform: 'osx-aarch_64'
        - path: '{{ Env.JAVA_HOME }}'
          platform: 'osx-x86_64'
        - path: '{{ Env.JAVA_HOME }}'
          platform: 'windows-x86_64'
        - path: '{{ Env.JAVA_HOME }}'
          platform: 'linux-x86_64'
      mainJar:
        path: 'backend/target/spec-writer-runner.jar'

  jpackage:
    spec-writer:
      active: ALWAYS
      exported: true
      jlink: spec-writer-runtime
      mainJar:
        path: 'backend/target/spec-writer-runner.jar'
      applicationPackage:
        appName: spec-writer
        # Écrit par le profil dist du backend, qui lit ce fichier depuis backend/target : la version du
        # pom sans -SNAPSHOT (ou -Dspecwriter.app.version, fixée par la release depuis le tag). Sous
        # macOS, jpackage refuse une version qui commence par 0 : il reçoit 1.0.0, la version réelle
        # est dans dist/macos/Info.plist et dans le nom du .dmg.
        appVersion: '@JPACKAGE_VERSION@'
        vendor: spec-writer
        copyright: '2026 Benjamin Raimondi'
        licenseFile: 'LICENSE'
      launcher:
        # Le lanceur passe par le classpath, pas par -jar : Java n'applique donc pas les Add-Opens et
        # Enable-Native-Access du manifeste de Quarkus. Ils sont repris ici.
        javaOptions:
          - '-Xshare:auto'
          - '--add-opens=java.base/java.lang=ALL-UNNAMED'
          - '--add-opens=java.base/java.nio=ALL-UNNAMED'
          - '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
          - '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED'
          - '--enable-native-access=ALL-UNNAMED'
        # passerelle MCP pour les agents de code : lanceur spec-writer-mcp à côté de l'application
        launchers:
          - 'spec-writer-mcp=dist/launchers/spec-writer-mcp.properties'
      osx:
        types: [dmg]
        icon: 'dist/assets/spec-writer.icns'
        # Info.plist de dist/macos, version réelle écrite par le profil dist
        resourceDir: 'backend/target/jpackage-resources/osx'
        packageName: spec-writer
        packageIdentifier: fr.kawamind.spec-writer
      windows:
        types: [msi]
        icon: 'dist/assets/spec-writer.ico'
        menu: true
        menuGroup: spec-writer
        shortcut: true
        perUserInstall: true
        dirChooser: false
        # Constant d'une version à l'autre : permet la mise à jour en place par le .msi
        upgradeUuid: '6f1c2e4a-8b3d-4d6e-9a2f-5c7b1e0d3a94'
      linux:
        types: [deb]
        icon: 'dist/assets/spec-writer.png'
        packageName: spec-writer
        maintainer: braimondi@kawamind.fr
        menuGroup: Development
