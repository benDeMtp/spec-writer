# --- Serveur HTTP local (research.md R14) -------------------------------------------------------
# Écoute uniquement sur la boucle locale. Le port effectif est fourni par DataDirConfigSource
# (port configuré via -Dspecwriter.port, 47615 par défaut, ou un port libre s'il est occupé).
quarkus.http.host=127.0.0.1
quarkus.http.cors.enabled=false
quarkus.http.test-port=0
quarkus.banner.enabled=false

# --- Base embarquée (research.md R7) ------------------------------------------------------------
# L'URL JDBC (dossier de données de l'OS + pragmas WAL, foreign_keys, busy_timeout) est fournie
# par DataDirConfigSource.
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.max-size=8
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

# --- Journaux (FR-025, FR-034) ------------------------------------------------------------------
# Aucun corps de requête ni de réponse n'est journalisé ; les jetons sont masqués par le filtre.
quarkus.log.level=INFO
quarkus.log.console.filter=redacting
quarkus.log.category."com.github.copilot".level=WARN

# --- Application ---------------------------------------------------------------------------------
specwriter.open-browser=true
%dev.specwriter.open-browser=false
%test.specwriter.open-browser=false
%e2e.specwriter.open-browser=false

# Tests : journaux également écrits dans un fichier, filtré, pour LogRedactionTest
%test.quarkus.log.file.enabled=true
%test.quarkus.log.file.path=target/test-logs/spec-writer.log
%test.quarkus.log.file.filter=redacting

# E2E : GitHub simulé (FakeGitHubAuthenticator) ; le rejeu du LLM est activé par
# -Dspecwriter.llm.replay-dir (playwright.config.ts)
%e2e.specwriter.github.fake=true
%test.specwriter.github.fake=true
# Les tests et l'E2E ne touchent jamais au trousseau réel de l'utilisateur
%test.specwriter.secrets.simulated-keychain=true
%e2e.specwriter.secrets.simulated-keychain=true
# Corps de requête limité : besoin de 10 000 caractères, réponses de 5 000 (contrôlés aussi par le domaine)
quarkus.http.limits.max-body-size=256K
# LLM rejoué pour les @QuarkusTest (format de ReplayChatModel, comme les fixtures E2E)
%test.specwriter.llm.replay-dir=src/test/resources/llm-replay

# --- Dev mode (research.md R17) ------------------------------------------------------------------
# Déterministe par défaut : ni compte, ni AI Credits, ni trousseau réel. Port 47625 et dossier
# .dev-data/ sont passés en propriétés système par quarkus-maven-plugin (backend/pom.xml).
%dev.specwriter.github.fake=true
%dev.specwriter.secrets.simulated-keychain=true
%dev.specwriter.llm.replay-dir=../e2e/fixtures/llm
%dev.specwriter.print-launch-url=true
# Les cookies de session survivent au rechargement à chaud (LaunchTokenService, dev mode seul)
%dev.specwriter.dev.session-file=${specwriter.data-dir}/dev-sessions
# La validation post-démarrage d'Hibernate échoue sur les tables virtuelles FTS5 (Flyway fait foi)
%dev.quarkus.hibernate-orm.validate-in-dev-mode=false
# Dev MCP (/q/dev-mcp), utilisé par le serveur MCP Quarkus ; désactivé par défaut dans Quarkus
%dev.quarkus.dev-mcp.enabled=true
# Tests continus relancés à la demande (Dev MCP), pas à chaque modification
%dev.quarkus.test.continuous-testing=paused
# Profil live, cumulé avec dev (-Dquarkus.profile=dev,live) : vrai Copilot et vrai trousseau
%live.specwriter.github.fake=false
%live.specwriter.secrets.simulated-keychain=false
%live.specwriter.llm.replay-dir=
