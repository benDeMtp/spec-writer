# Forgejo Actions : quality gates obligatoires avant fusion dans main.
# Rendre ce job obligatoire dans les règles de protection de la branche main (Forgejo).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: docker
    container:
      image: eclipse-temurin:25-jdk
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Outils (Node 24, Semgrep, gitleaks)
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git python3-pip pipx xz-utils
          curl -fsSL https://nodejs.org/dist/v24.15.0/node-v24.15.0-linux-x64.tar.xz | tar -xJ -C /opt
          echo "/opt/node-v24.15.0-linux-x64/bin" >> "$GITHUB_PATH"
          pipx install semgrep && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks

      - name: Cache Maven
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}

      - name: Quality gates
        run: ci/verify.sh

      - name: Rapports
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            backend/target/site/jacoco/
            backend/target/surefire-reports/
            e2e/playwright-report/
